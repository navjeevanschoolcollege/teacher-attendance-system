name: Daily Excel Report & Keep-Alive

on:
  schedule:
    - cron: '30 0 * * *'   # 6:00 AM IST - Keep alive ping
    - cron: '30 12 * * *'  # 6:00 PM IST - Daily Excel
  workflow_dispatch:

jobs:
  keep-alive:
    if: github.event.schedule == '30 0 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to keep alive
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/wifi_settings?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          echo "Supabase pinged successfully"

  daily-excel:
    if: github.event.schedule == '30 12 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Generate Daily Excel Report
        run: |
          DATE=$(date +%Y-%m-%d)
          echo "Generating Excel for $DATE"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "${{ secrets.VERCEL_APP_URL }}/api/export-excel?date=$DATE&upload=true" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Response: $HTTP_CODE"
          echo "$BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Failed to generate Excel"
            exit 1
          fi
